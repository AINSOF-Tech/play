<!--
  The page a customer lands on when they click "listen".

  Or, 30.7.2026: "תעשה נגן שרואים גל קול אמיתי".

  ⚠️ REAL, and that word is the whole specification. It would have been quicker to
  animate some bars to a timer and call it a waveform, and a music supervisor
  would spot it in about a second — the peaks would not line up with what they
  were hearing. So the file is decoded with the Web Audio API and the peaks are
  measured from the samples. What is drawn IS the audio.

  ⚠️ The file is fetched ONCE. decodeAudioData needs an ArrayBuffer and the
  <audio> element needs a URL, and doing those separately downloads two megabytes
  twice. One fetch, a Blob URL for playback, and a copy of the buffer for the
  decoder — copied deliberately, because decodeAudioData detaches what it is
  given and the Blob would be reading from a corpse.

  ⚠️ ONE page for the whole catalogue, not one per track. Or asked directly:
  "לכל טראק נעשה דף?". 772 generated pages go stale on the next release; this
  reads the track from the address and fetches the rest live.

      …/play/#AIN-CAT_057_001

  ⚠️ Loads nothing external. No CDN, no web font, no analytics — only our own API
  and our own storage. Today a chat client generated its own player for our
  results and its content policy silently blocked our audio host. A page that
  depends on nothing cannot fail that way.

  ⚠️ Works from file:// as well as over http, because the first place it gets
  opened is a desktop. No modules, no build step, one document.
-->

  /* ⚠️ Palette taken verbatim from Or's own site (~/Desktop/AIN/ainsof-site),
     not chosen here. He asked for it explicitly: "חייב אותם צבעים של דף
     הנחיתה". A listen link opens straight out of a chat, so it has to look like
     the same company answered. */
  /* Inlined, not linked. The header of this file states the page loads nothing
     external — no CDN, no web font — and a <link> to a font host would have
     quietly broken that promise on the one screen a stranger might land on.

  :root {
    color-scheme: dark;
    --bg:#101013; --surface:#17171b; --line:rgba(255,255,255,.075);
    --ink:#fff; --ink-2:#9d9da8; --ink-3:#5c5c67; --coral:#d9895f; --coral-dim:rgba(217,137,95,.16); --r:14px;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; padding: 26px 20px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% -5%, #1a1a1f 0%, var(--bg) 62%);
    color: var(--ink);
    font: 16px/1.55 'Geist', ui-sans-serif, -apple-system, system-ui, "Segoe UI", sans-serif;
    letter-spacing: -.014em;
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 440px; text-align: center }

  /* Or: "הלוגו של אינסוף לא במקום הנכון. שים הלוגו הרגיל, הרקע שלנו, הכל כאילו
     זה דף של האתר שלנו." Same wordmark the site header uses — the square mark
     centred over the artwork read as a second album cover rather than a brand.
     Top left, at the site's own size, so a listen link opens on something that
     is recognisably ours before anything else loads.
     ⚠️ This asset is white already; the stacked mark used before was black and
     needed inverting. Inverting this one would have made it disappear. */
  /* ⚠️ Aligned to the site's content column, not to the viewport edge. The site
     puts its mark inside .wrap — max-width 1240 with 40px of padding — so glued
     to the left of the window it sat in a place the mark never sits anywhere
     else. Same 24px from the top, same 26px height, same left edge as every
     other page once the viewport is wide enough for the column to matter. */
  .topmark{position:fixed;top:24px;left:40px;z-index:5;display:block;opacity:.92;
    transition:opacity .25s}
  @media (min-width:1320px){.topmark{left:calc(50% - 620px + 40px)}}
  .topmark:hover{opacity:1}
  .topmark img{height:26px;width:auto;display:block}
  @media (max-width:640px){.topmark{position:static;margin:0 auto 26px}
    .topmark img{margin:0 auto;height:24px}}
  .artwrap { border-radius: var(--r); overflow: hidden; background: var(--surface);
             box-shadow: 0 24px 60px rgba(0,0,0,.55) }
  .art { width: 100%; aspect-ratio: 1; object-fit: cover; display: block }
  .art.none { display: flex; align-items: center; justify-content: center;
              letter-spacing: .19em; font-size: 12px; color: rgba(255,255,255,.4) }

  h1 { font-size: 25px; line-height: 1.25; margin: 22px 0 6px; font-weight: 650;
       letter-spacing: -.01em }
  .album { color: rgba(255,255,255,.66); font-size: 15px; margin: 0 0 6px }
  .meta  { color: rgba(255,255,255,.42); font-size: 13px; margin: 0 0 20px }
  .meta span { white-space: nowrap }

  /* ── the waveform ─────────────────────────────────────────────────────── */
  .wave { position: relative; height: 82px; margin: 0 0 6px; cursor: pointer;
          border-radius: 10px }
  .wave canvas { width: 100%; height: 100%; display: block }
  .wave.loading::after {
    content: ""; position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    background-size: 220% 100%; animation: sweep 1.25s linear infinite;
  }
  @keyframes sweep { from { background-position: 120% 0 } to { background-position: -120% 0 } }

  .times { display: flex; justify-content: space-between;
           font-variant-numeric: tabular-nums; font-size: 12px; color: rgba(255,255,255,.4);
           margin-bottom: 16px }

  .row { display: flex; align-items: center; justify-content: center; gap: 14px }
  /* ⚠️ 3.8.2026 — Or: "הכפתור הזה לא דומה לשאר הכפתורים, יש לנו סיסטם דיזיין".
     The last control on this page still outside it. It was a solid coral disc
     with a dark glyph — the same "fill it with brand colour" move already
     corrected on the version pills, and the loudest thing on a page whose
     subject is the artwork above it.
     Same glass as the download button and the site's .cta: white at low alpha,
     an inset hairline, stacked highlights, and a deep drop. The coral moves to
     the GLYPH, which is where the system puts it — .cta span is coral, and this
     is the same idea at transport size. Round is kept: a play control is round
     everywhere, and that is affordance rather than decoration.
     Lifts on hover like every other button here instead of scaling, so the whole
     page moves the same way. */
  .play {
    width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    color: var(--coral); display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15),
                0 9px 0 -3px rgba(255,255,255,.05),
                0 18px 0 -7px rgba(255,255,255,.028),
                0 22px 46px -26px rgba(0,0,0,.9);
    transition: transform .42s cubic-bezier(.16,1,.3,1),
                box-shadow .42s cubic-bezier(.16,1,.3,1),
                background .42s cubic-bezier(.16,1,.3,1);
  }
  .play:hover {
    transform: translateY(-3px); background: rgba(255,255,255,.085);
    box-shadow: inset 0 0 0 1px var(--coral),
                0 11px 0 -3px rgba(217,137,95,.16),
                0 22px 0 -7px rgba(217,137,95,.07),
                0 28px 54px -26px rgba(0,0,0,.95);
  }
  .play svg { width: 22px; height: 22px; fill: currentColor }
  @media (prefers-reduced-motion: reduce) {
    .play, .dl a, .vers button { transition: none }
    .play:hover, .dl a:hover { transform: none }
  }

  /* ⚠️ 3.8.2026 — Or: "הכפתורים בדף הזה לא כמו הכפתורים באתר המקורי שלנו".
     He was right. The download had been brought into line earlier the same day
     but these were left: fully-rounded chips, and the selected one a solid coral
     fill with dark text. The site does the opposite — a glass track holding the
     row, each pill a soft rectangle, and the selected one marked by a CORAL
     HAIRLINE over the same glass rather than by inverting it. Filling a pill
     with brand colour is the loudest possible way to say "selected" and it is
     not how anything else we own says it.
     Copied from .pills / .pill on ainsof.io, scaled down for this page's smaller
     row. Nothing invented here. */
  .vers { display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: center;
          margin-top: 18px; padding: 5px; border-radius: 15px;
          background: rgba(255,255,255,.035);
          -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
          border: 1px solid rgba(255,255,255,.09) }
  .vers button {
    font: inherit; font-size: 13px; font-weight: 500; letter-spacing: -.015em;
    padding: 9px 15px; border-radius: 10px; border: 0; background: none;
    cursor: pointer; color: var(--ink-3);
    transition: background .3s, color .3s, box-shadow .4s cubic-bezier(.16,1,.3,1);
  }
  .vers button:hover { color: rgba(255,255,255,.82) }
  .vers button[aria-current="true"] {
    background: rgba(255,255,255,.07); color: #fff;
    box-shadow: inset 0 0 0 1px var(--coral),
                0 6px 0 -2px rgba(217,137,95,.14),
                0 12px 0 -5px rgba(217,137,95,.06) }

  /* Two rows now instead of one, so each has to say what it is. Without a label,
     a row reading "Drums / Guitar / Piano" looks like alternative mixes rather
     than isolated instruments. */
  .grouplbl { margin: 22px 0 -4px; font-size: 10.5px; letter-spacing: .18em;
    text-transform: uppercase; color: rgba(255,255,255,.32) }
  /* The stems row is the same control, so it gets the same track. */
  .vers.stems { background: rgba(255,255,255,.028) }
  /* ⚠️ 3.8.2026 — Or: "שים לב שהכפתורים האלה בדיוק אותו דבר יהיו גם בדף תצוגה
     של הנגן מוזיקה שלנו". This was a quiet underlined link, on the reasoning that
     a watermarked preview should not be offered like a master. That reasoning was
     about tone and it cost us consistency: the same product now has one button in
     three places and it has to be one button.
     The glass button Or picked for the site, unchanged — same padding, radius,
     inset hairline, stacked highlights and coral hover. What keeps the honesty is
     the label and the line under it, not a weaker control. */
  .dl { margin-top: 24px }
  .dl a {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 13px 24px; border-radius: 13px;
    background: rgba(255,255,255,.055); -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    color: #fff; text-decoration: none; border: 0;
    font: inherit; font-weight: 500; font-size: 15.5px; letter-spacing: -.02em;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15),
                0 9px 0 -3px rgba(255,255,255,.05),
                0 18px 0 -7px rgba(255,255,255,.028),
                0 22px 46px -26px rgba(0,0,0,.9);
    transition: transform .42s var(--ease, cubic-bezier(.16,1,.3,1)),
                box-shadow .42s var(--ease, cubic-bezier(.16,1,.3,1)),
                background .42s var(--ease, cubic-bezier(.16,1,.3,1));
  }
  .dl a span { color: var(--coral) }
  .dl a:hover {
    transform: translateY(-3px); background: rgba(255,255,255,.085);
    box-shadow: inset 0 0 0 1px var(--coral),
                0 11px 0 -3px rgba(217,137,95,.16),
                0 22px 0 -7px rgba(217,137,95,.07),
                0 28px 54px -26px rgba(0,0,0,.95);
  }

  .foot { margin-top: 24px; font-size: 12px; color: rgba(255,255,255,.38); line-height: 1.85 }
  .foot a { color: var(--coral); text-decoration: none }
  .foot a:hover { text-decoration: underline }
  /* ⚠️ 3.8.2026 — Or: "הסימן מים שכתוב שם שים אותו בצורה יפה ועדינה".
     It had been a filled chip, then an outlined one. Both were still a BADGE,
     and a badge sitting under the main button competes with it — it reads as
     something to press, or as a warning stamped on the page.
     The information matters and the shouting does not. So: no box, no ring, no
     uppercase. A small coral dot, the words at reading weight, and the licence
     line folded onto the same sentence instead of stacked under it. Quiet
     enough to sit at the bottom of the page, still the first thing you read if
     you are wondering whether you can use the file. */
  .wm { color: var(--ink-2); font-size: 12.5px; letter-spacing: -.01em }
  .wm::before { content: ""; display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--coral); vertical-align: middle;
    margin-right: 8px; margin-top: -2px }

  .err { padding: 44px 20px; color: rgba(255,255,255,.55) }
  .brand { width: 62px; height: auto; display: block; margin: 0 auto 26px;
           filter: invert(1); opacity: .92 }
  .lede { font-size: 21px; font-weight: 620; letter-spacing: -.02em; margin: 0 0 10px }
  .hint { color: rgba(255,255,255,.45); font-size: 14.5px; max-width: 330px;
          margin: 0 auto; line-height: 1.6 }
  @media (prefers-color-scheme: light) { .brand { filter: none } }

  @media (prefers-color-scheme: light) {
    body { background: radial-gradient(120% 90% at 50% 0%, #fff 0%, #f1f1f4 62%);
           color: #16161c }
    .album { color: #5c5c6c }
    .meta, .foot, .times { color: #7a7a8a }
    /* Glass built from white alpha reads as a hole on a light background. */
    .play { background: rgba(0,0,0,.045); color: var(--coral);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12),
                  0 10px 26px -18px rgba(0,0,0,.5) }
    .play:hover { background: rgba(0,0,0,.07);
      box-shadow: inset 0 0 0 1px var(--coral),
                  0 14px 30px -18px rgba(0,0,0,.55) }
    /* The glass button reads as a hole on a light background — it is built from
       white at low alpha. Same geometry, inverted ink. */
    .dl a { background: rgba(0,0,0,.045); color: #14141a;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12),
                  0 10px 26px -18px rgba(0,0,0,.5) }
    .dl a:hover { background: rgba(0,0,0,.07);
      box-shadow: inset 0 0 0 1px var(--coral),
                  0 14px 30px -18px rgba(0,0,0,.55) }
    .vers { background: rgba(0,0,0,.035); border-color: rgba(0,0,0,.1) }

<body>
<div class="card" id="root"><div class="err">…</div></div>

<script>
/* ⚠️ Our own address, not the raw Supabase one. Everything a listener can see —
   the download link, the audio request, the network tab — carried a project id
   on a vendor domain. Measured: mcp.ainsof.io/p/... answers identically, a 302
   to the same signed object. Or: "זה לא הלינק הנכון בכלל". */
const API = "https://mcp.ainsof.io";
const BARS = 128;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const clock = (sec) => {
  const n = Math.max(0, Math.round(Number(sec) || 0));
  return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`;
};

function label(v) {
  if (v.startsWith("STEM_")) v = v.slice(5);
  const m = /^CUT_(\d+)$/.exec(v);
  if (m) return `${m[1]}s`;
  if (v === "MAIN") return "Full mix";
  return v.split("_").map((w) => w[0] + w.slice(1).toLowerCase()).join(" ");
}

/** "#AIN-CAT_057_001" or "?t=…" -> the slug, or null. */
function slug() {
  const h = location.hash.replace(/^#/, "").trim();
  return h || new URLSearchParams(location.search).get("t");
}

/**
 * "AIN-CAT_057_001" or "AIN-CAT_057_001/CUT_30" -> {id, version}.
 *
 * ⚠️ The version half exists because every cutdown and every stem gets its own
 * link, and those links have to open ON that version rather than on the full mix.
 * The first draft of this parser rejected anything with a slash, which would have
 * broken every stem link the moment they were published.
 */
function parseSlug(raw) {
  const [core, version] = String(raw || "").split("/");
  const m = /^(AIN-[A-Z]+)_(\d+)_(\d+)$/i.exec(core || "");
  if (!m) return null;
  return {
    id: `${m[1].toUpperCase()} ${m[2]}_${m[3]}`,
    core,
    version: /^[A-Z0-9_]{1,24}$/i.test(version || "") ? version.toUpperCase() : "MAIN",
  };
}

const audioUrl = (s, v) =>
  `${API}/p/${s}${v && v !== "MAIN" ? "/" + v : ""}?raw=1`;

// ── the waveform ───────────────────────────────────────────────────────────

/**
 * Peak amplitude per bar, measured from the decoded samples.
 *
 * ⚠️ Peak, not average. An average flattens a cue into a uniform sausage and
 * every track ends up looking like every other one; the peak keeps the hits, the
 * silences and the shape of the arrangement, which is the entire reason a
 * supervisor glances at a waveform at all.
 *
 * ⚠️ Normalised against the loudest bar rather than against 1.0. These are
 * production cues, often mixed quietly on purpose, and against an absolute
 * ceiling a delicate piano piece would render as a flat line.
 */
function peaks(buffer, bars) {
  const ch = buffer.getChannelData(0);
  const step = Math.floor(ch.length / bars) || 1;
  const out = new Array(bars).fill(0);
  let max = 0;
  for (let b = 0; b < bars; b++) {
    const start = b * step;
    const end = Math.min(start + step, ch.length);
    let peak = 0;
    // Every 16th sample: at 44.1kHz a bar spans thousands of samples and a true
    // peak survives the decimation, while reading all of them stalls the page.
    for (let i = start; i < end; i += 16) {
      const v = ch[i] < 0 ? -ch[i] : ch[i];
      if (v > peak) peak = v;
    }
    out[b] = peak;
    if (peak > max) max = peak;
  }
  return max > 0 ? out.map((v) => v / max) : out;
}

function drawWave(canvas, data, progress) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);

  const light = matchMedia("(prefers-color-scheme: light)").matches;
  // Coral for what has played — the same accent as the site.
  const played = "#d9895f";
  const ahead  = light ? "rgba(0,0,0,.16)" : "rgba(255,255,255,.17)";

  const gap = 2;
  const bw = Math.max(1, (w - gap * (data.length - 1)) / data.length);
  const mid = h / 2;
  const cut = progress * w;

  for (let i = 0; i < data.length; i++) {
    const x = i * (bw + gap);
    // A floor of 2px so silence still reads as a track rather than a hole.
    const bh = Math.max(2, data[i] * (h - 6));
    g.fillStyle = x < cut ? played : ahead;
    g.beginPath();
    const r = Math.min(bw / 2, 2);
    g.roundRect(x, mid - bh / 2, bw, bh, r);
    g.fill();
  }
}

// ── page ───────────────────────────────────────────────────────────────────

let audio, canvas, wrap, data = null, objectUrl = null, _ac = null;

/** The page's single AudioContext, created on first use. */
function ctx() {
  if (!_ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    _ac = new AC();
  }
  // Created before any interaction it starts suspended; decoding works either
  // way, but resuming keeps it from being reclaimed on some browsers.
  if (_ac.state === "suspended") _ac.resume().catch(() => {});
  return _ac;
}

async function loadAudio(url) {
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  data = null;
  wrap.classList.add("loading");
  drawWave(canvas, new Array(BARS).fill(0.06), 0);

  const bytes = await (await fetch(url)).arrayBuffer();

  // Playback first: if decoding fails the music must still work.
  objectUrl = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
  audio.src = objectUrl;

  try {
    // ⚠️ ONE AudioContext for the life of the page, not one per load. The first
    // version built a new one on every call, and a browser caps a document at
    // about six: a visitor comparing the full mix against a 30 and a 15 would
    // hit the ceiling, `new AudioContext()` would throw, and the waveform — the
    // whole point of this page — would quietly stop being drawn while playback
    // carried on. Silent degradation of the headline feature.
    const decoded = await ctx().decodeAudioData(bytes.slice(0));
    data = peaks(decoded, BARS);
  } catch (_) {
    // No waveform is survivable; a broken page is not.
    data = new Array(BARS).fill(0.12);
  }
  wrap.classList.remove("loading");
  drawWave(canvas, data, 0);
}

function tick() {
  if (data && audio.duration) {
    drawWave(canvas, data, audio.currentTime / audio.duration);
    document.getElementById("t-now").textContent = clock(audio.currentTime);
    document.getElementById("t-end").textContent = clock(audio.duration);
  }
  requestAnimationFrame(tick);
}

    <div class="artwrap">${cover

    ${c.album ? `<p class="album">${esc(c.album)}</p>` : ""}
    ${bits.length ? `<p class="meta">${bits.map((b) => `<span>${esc(b)}</span>`)

          esc(label(v))}</button>`).join("")}</div>` : ""}

  audio  = document.getElementById("a");
  canvas = document.getElementById("cv");
  wrap   = document.getElementById("wave");
  const pp = document.getElementById("pp");

  pp.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay  = () => { pp.innerHTML = ICON_PAUSE; pp.setAttribute("aria-label", "Pause"); };
  audio.onpause = () => { pp.innerHTML = ICON_PLAY;  pp.setAttribute("aria-label", "Play"); };
  audio.onended = () => { pp.innerHTML = ICON_PLAY; };

  wrap.onclick = (e) => {
    if (!audio.duration) return;
    const r = wrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  };

  /* ⚠️ The download link is rebuilt on every switch. Wiring it once to whatever
     was playing at load would hand someone the full mix while the page says
     "No Drums" — a wrong file that looks right is worse than no link at all. */
  /* ⚠️ `download` on an <a> is ignored the moment the href is cross-origin — and
     ours always is: /p/ answers with a 302 to signed storage on another host. The
     attribute was there, the browser dropped it, and the link simply navigated to
     the audio. Or: "שלוחצים להורדה זה אמור ישר להוריד, זה פותח לי עוד לינק".
     Fetching the bytes and handing the browser a blob from this origin is what
     actually downloads. The page already fetches the same file for the waveform,
     so the CORS path is known to work. */
  let dlBusy = false;
  const setDl = (v) => {
    const dl = document.getElementById("dl");
    if (!dl) return;
    const name = `${core}${v && v !== "MAIN" ? "_" + v : ""}.mp3`;
    const idle = `Download ${label(v)} \u2014 watermarked`;
    dl.textContent = idle;
    dl.href = audioUrl(s, v);
    dl.removeAttribute("download");
    dl.onclick = async (e) => {
      e.preventDefault();
      if (dlBusy) return;
      dlBusy = true;
      dl.textContent = "Preparing\u2026";
      try {
        const blob = await (await fetch(audioUrl(s, v))).blob();
        const u = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = u; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        // Revoked on a delay: Safari has not finished reading the blob when the
        // click returns, and revoking immediately produces a zero-byte file.
        setTimeout(() => URL.revokeObjectURL(u), 4000);
        dl.textContent = idle;
      } catch (_) {
        // A failed download must not look like a successful one.
        dl.textContent = "Download failed \u2014 try again";
        setTimeout(() => { dl.textContent = idle; }, 2600);
      }
      dlBusy = false;
    };
  };
  setDl(start);

  document.querySelectorAll("[data-v]").forEach((b) => {
    b.onclick = async () => {
      document.querySelectorAll("[data-v]").forEach((x) => x.removeAttribute("aria-current"));
      b.setAttribute("aria-current", "true");
      setDl(b.dataset.v);
      const wasPlaying = !audio.paused;
      await loadAudio(audioUrl(s, b.dataset.v));
      if (wasPlaying) audio.play().catch(() => {});
    };
  });

  addEventListener("resize", () => data && drawWave(canvas, data,
    audio.duration ? audio.currentTime / audio.duration : 0));

  tick();
  await loadAudio(audioUrl(s, start));
  // Autoplay is blocked until the visitor has interacted, and that is correct of
  // the browser. Arriving from a click usually counts; when it does not, the
  // waveform and a large play button are unmistakably a player — which is what
  // the blank tab this replaced was missing.
  audio.play().catch(() => {});
}
